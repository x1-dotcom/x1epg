name: Sync X1 EPG Sources

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches:
      - main
    paths:
      - 'sources/**'
      - 'data/source-candidates.json'
      - 'tools/build_index.py'
      - 'tools/sync_epg.py'
      - 'tools/plan_merge.py'
      - 'tools/generate_xmltv.py'
      - 'tools/audit_source_candidates.py'
      - 'tools/validate_sources.py'
      - '.github/workflows/sync-epg.yml'

permissions:
  contents: write

concurrency:
  group: x1-epg-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate approved source manifests
        run: python tools/validate_sources.py

      - name: Build canonical catalog from approved manifests
        run: python tools/build_index.py

      - name: Validate canonical catalog
        run: python tools/validate_catalog.py

      - name: Audit untrusted source candidates
        continue-on-error: true
        run: python tools/audit_source_candidates.py

      - name: Ingest and validate approved live XMLTV sources
        id: sync
        continue-on-error: true
        run: python tools/sync_epg.py

      - name: Build priority/fallback merge plan
        id: merge
        if: steps.sync.outcome == 'success'
        continue-on-error: true
        run: python tools/plan_merge.py

      - name: Check public XMLTV generation rights
        if: steps.merge.outcome == 'success'
        run: python tools/generate_xmltv.py --check-rights

      - name: Show merge decision
        if: steps.merge.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          r = json.load(open('data/merge-report.json', encoding='utf-8'))
          print('Channels:', r['channelCount'])
          print('Available:', r['availableCount'])
          print('Unavailable:', r['unavailableCount'])
          print('Fallback used:', r['fallbackUsedCount'])
          print('Selected rights blocked:', r['selectedRightsBlockedCount'])
          print('Public XMLTV generation allowed:', r['publicGenerationAllowed'])
          if __import__('pathlib').Path('data/source-candidate-report.json').exists():
              c = json.load(open('data/source-candidate-report.json', encoding='utf-8'))
              for row in c.get('candidates', []):
                  print('Candidate:', row['candidateId'], row['decision'], 'newest=', row.get('newestProgramme'))
          PY

      - name: Persist canonical index, health, candidate and merge reports
        if: always()
        run: |
          if [ ! -f data/sync-report.json ]; then
            echo 'sync report missing'
            exit 1
          fi
          git config user.name 'x1-epg-bot'
          git config user.email 'x1-epg-bot@users.noreply.github.com'
          git add data/index.json data/sync-report.json
          if [ -f data/source-candidate-report.json ]; then
            git add data/source-candidate-report.json
          fi
          if [ -f data/merge-report.json ]; then
            git add data/merge-report.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh X1 EPG canonical, source, candidate and fallback health'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Fail if live ingestion validation failed
        if: steps.sync.outcome == 'failure'
        run: exit 1

      - name: Fail if fallback planning found unavailable channels
        if: steps.sync.outcome == 'success' && steps.merge.outcome == 'failure'
        run: exit 1
