name: Sync X1 EPG Sources

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches:
      - main
    paths:
      - 'sources/**'
      - 'data/source-candidates.json'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/sync-epg.yml'

permissions:
  contents: write

concurrency:
  group: x1-epg-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify existing integrity chain before runtime work
        run: python tools/integrity_chain.py verify

      - name: Validate approved source manifests
        run: python tools/validate_sources.py

      - name: Capture last-known-good canonical index
        run: python tools/lkg_guard.py snapshot

      - name: Build canonical catalog candidate from approved manifests
        run: python tools/build_index.py

      - name: Validate canonical catalog candidate
        run: python tools/validate_catalog.py

      - name: Validate global manifest/index candidate consistency
        run: python tools/global_validate.py

      - name: Build canonical catalog coverage report
        run: python tools/catalog_coverage.py

      - name: Validate exact upstream channel-list mappings
        id: channel_list
        continue-on-error: true
        run: python tools/validate_channel_lists.py

      - name: Audit untrusted source candidates
        continue-on-error: true
        run: python tools/audit_source_candidates.py

      - name: Compare EPGShare01 and dobleM channel-by-channel
        id: compare
        continue-on-error: true
        run: python tools/compare_sources.py

      - name: Build advisory EPG quality recommendations
        id: quality
        if: steps.compare.outcome == 'success'
        continue-on-error: true
        run: python tools/quality_engine.py

      - name: Apply stateful anti-flap decision guard
        if: steps.quality.outcome == 'success'
        continue-on-error: true
        run: python tools/decision_guard.py

      - name: Ingest and validate approved live XMLTV sources
        id: sync
        continue-on-error: true
        run: python tools/sync_epg.py

      - name: Build runtime failure forensics
        if: always()
        run: python tools/runtime_failure_forensics.py

      - name: Build priority/fallback merge plan
        id: merge
        if: steps.sync.outcome == 'success'
        continue-on-error: true
        run: python tools/plan_merge.py

      - name: Check public XMLTV generation rights
        if: steps.merge.outcome == 'success'
        run: python tools/generate_xmltv.py --check-rights

      - name: Promote candidate or restore last-known-good index
        if: always()
        run: |
          python tools/lkg_guard.py finalize \
            --channel-list "${{ steps.channel_list.outcome }}" \
            --sync "${{ steps.sync.outcome }}" \
            --merge "${{ steps.merge.outcome }}"

      - name: Build immutable run provenance manifest
        if: always()
        run: python tools/run_provenance.py

      - name: Append provenance to integrity chain
        if: always()
        run: python tools/integrity_chain.py append

      - name: Verify integrity chain after append
        if: always()
        run: python tools/integrity_chain.py verify

      - name: Show validation and merge decision
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          if Path('data/integrity-chain.json').exists():
              i = json.load(open('data/integrity-chain.json', encoding='utf-8'))
              print('Integrity chain sequence:', i['sequence'])
              print('Integrity chain head:', i['headSha256'])
              print('Integrity previous head:', i.get('previousHeadSha256'))
              print('Integrity provenance:', i.get('provenanceSha256'))
          if Path('data/run-provenance.json').exists():
              p = json.load(open('data/run-provenance.json', encoding='utf-8'))
              print('Provenance digest:', p['provenanceSha256'])
              print('Provenance commit:', p['identity'].get('commitSha'))
              print('Provenance run:', p['identity'].get('runId'), 'attempt', p['identity'].get('runAttempt'))
              print('Manifest count:', len(p.get('manifests', [])))
              print('Upstream digest count:', len(p.get('upstreamArtifacts', [])))
          if Path('data/lkg-decision.json').exists():
              l = json.load(open('data/lkg-decision.json', encoding='utf-8'))
              print('LKG decision:', l['decision'])
              print('LKG gates:', l['gates'])
              print('LKG rollback performed:', l['rollbackPerformed'])
              print('Active index:', l['activeIndex'])
          if Path('data/global-validation.json').exists():
              g = json.load(open('data/global-validation.json', encoding='utf-8'))
              print('Candidate global validation:', g['status'])
              print('Candidate canonical channels:', g['indexChannelCount'])
              print('Candidate countries:', g['countries'])
              print('Candidate picon coverage:', g['piconCoverage'])
          if Path('data/channel-list-validation.json').exists():
              c = json.load(open('data/channel-list-validation.json', encoding='utf-8'))
              print('Channel-list sources:', [(r.get('sourceId'), r.get('status'), len(r.get('mappedMissing', [])), r.get('channelListSha256')) for r in c.get('sources', [])])
          if Path('data/sync-report.json').exists():
              s = json.load(open('data/sync-report.json', encoding='utf-8'))
              for row in s.get('sources', []):
                  print('Live source:', row['sourceId'], row['status'], 'present=', f"{row.get('mappedPresent',0)}/{row.get('mappedExpected',0)}", 'programmes=', row.get('mappedProgrammeCount',0), 'fresh=', row.get('fresh'), 'wireSha=', row.get('compressedSha256'), 'xmlSha=', row.get('xmlSha256'))
          if Path('data/runtime-failure-forensics.json').exists():
              f = json.load(open('data/runtime-failure-forensics.json', encoding='utf-8'))
              print('Runtime forensics:', f['status'], 'failures=', f['failureCount'])
              print('Forensics by issue:', f['countsByIssue'])
              print('Forensics by country:', f['countsByCountry'])
              for row in f.get('failures', [])[:50]:
                  print('Failure:', row.get('country'), row.get('sourceId'), row.get('issue'), row.get('canonicalId'), row.get('upstreamChannelId'), 'first=', row.get('firstSeenAt'), 'observations=', row.get('consecutiveObservations'))
          if Path('data/merge-report.json').exists():
              r = json.load(open('data/merge-report.json', encoding='utf-8'))
              print('Channels:', r['channelCount'])
              print('Available:', r['availableCount'])
              print('Unavailable:', r['unavailableCount'])
              print('Fallback used:', r['fallbackUsedCount'])
              print('Selected rights blocked:', r['selectedRightsBlockedCount'])
              print('Public XMLTV generation allowed:', r['publicGenerationAllowed'])
          if Path('data/catalog-coverage.json').exists():
              c = json.load(open('data/catalog-coverage.json', encoding='utf-8'))
              print('Catalog countries:', c['countryCount'])
              print('Catalog total channels:', c['totalChannels'])
          if Path('data/source-candidate-report.json').exists():
              c = json.load(open('data/source-candidate-report.json', encoding='utf-8'))
              for row in c.get('candidates', []):
                  print('Candidate:', row['candidateId'], row['decision'], 'newest=', row.get('newestProgramme'))
          if Path('data/source-comparison-report.json').exists():
              c = json.load(open('data/source-comparison-report.json', encoding='utf-8'))
              print('Spanish channels compared:', c['channelsCompared'])
              print('Technical winner counts:', c['winnerCounts'])
          if Path('data/quality-recommendations.json').exists():
              q = json.load(open('data/quality-recommendations.json', encoding='utf-8'))
              print('Advisory quality recommendations:', q['recommendationCounts'])
          if Path('data/quality-decision-report.json').exists():
              d = json.load(open('data/quality-decision-report.json', encoding='utf-8'))
              counts = {}
              for row in d.get('channels', []):
                  counts[row['action']] = counts.get(row['action'], 0) + 1
              print('Decision guard actions:', counts)
          PY

      - name: Persist active canonical index and health reports
        if: always()
        run: |
          if [ ! -f data/sync-report.json ]; then
            echo 'sync report missing'
            exit 1
          fi
          if [ ! -f data/lkg-decision.json ]; then
            echo 'LKG decision missing'
            exit 1
          fi
          if [ ! -f data/run-provenance.json ]; then
            echo 'run provenance missing'
            exit 1
          fi
          if [ ! -f data/integrity-chain.json ] || [ ! -f data/integrity-chain-history.jsonl ]; then
            echo 'integrity chain evidence missing'
            exit 1
          fi
          git config user.name 'x1-epg-bot'
          git config user.email 'x1-epg-bot@users.noreply.github.com'
          git add data/index.json data/sync-report.json data/lkg-decision.json data/run-provenance.json data/integrity-chain.json data/integrity-chain-history.jsonl
          for report in data/lkg-state.json data/global-validation.json data/catalog-coverage.json data/channel-list-validation.json data/runtime-failure-state.json data/runtime-failure-forensics.json data/source-candidate-report.json data/source-comparison-report.json data/quality-recommendations.json data/quality-state.json data/quality-decision-report.json data/merge-report.json; do
            if [ -f "$report" ]; then
              git add "$report"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh X1 EPG active LKG, provenance, integrity chain and runtime evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Fail if upstream channel-list preflight failed
        if: steps.channel_list.outcome == 'failure'
        run: exit 1

      - name: Fail if live ingestion validation failed
        if: steps.sync.outcome == 'failure'
        run: exit 1

      - name: Fail if fallback planning found unavailable channels
        if: steps.sync.outcome == 'success' && steps.merge.outcome == 'failure'
        run: exit 1
