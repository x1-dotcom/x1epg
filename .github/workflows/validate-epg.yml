name: Validate X1 EPG

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'sources/**'
      - 'tools/**'
      - '.github/workflows/validate-epg.yml'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate source manifests and rights gates
        run: python tools/validate_sources.py

      - name: Build canonical catalog from approved manifests
        run: python tools/build_index.py

      - name: Validate canonical catalog
        run: python tools/validate_catalog.py
