name: Validate X1 EPG

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'sources/**'
      - 'tools/**'
      - 'tests/**'
      - 'keys/**'
      - '.github/workflows/validate-epg.yml'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify integrity chain
        run: python tools/integrity_chain.py verify

      - name: Verify Ed25519 signed head when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f data/signed-integrity-head.json ]; then
            test -f keys/x1-epg-ed25519-public.pem
            python tools/signed_provenance.py verify
          else
            echo 'No signed integrity head is committed yet; P6.9 activation remains pending.'
          fi

      - name: Validate source manifests and rights gates
        run: python tools/validate_sources.py

      - name: Build canonical catalog from approved manifests
        run: python tools/build_index.py

      - name: Validate canonical catalog
        run: python tools/validate_catalog.py

      - name: Validate global manifest/index consistency
        run: python tools/global_validate.py
